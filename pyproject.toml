[project]
name = "mcp-vcr"
version = "0.1.5"
description = "A deterministic, replayable, human-readable MCP transcript format and proxy."
authors = [
    { name = "mcp-vcr contributors" }
]
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0.1",
    "click>=8.1.0",
    "jsonschema>=4.20.0",
]
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
mcp-vcr = "mcp_vcr.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"

[tool.setuptools]
packages = ["mcp_vcr", "mcp_vcr.schemas"]

[tool.setuptools.package-data]
mcp_vcr = ["schemas/transcript-schema-v1.json"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
