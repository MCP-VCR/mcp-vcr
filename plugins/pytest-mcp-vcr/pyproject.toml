[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytest-mcp-vcr"
version = "0.1.0"
description = "pytest fixtures for mcp-vcr"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0.0",
    "mcp-vcr",
]

[project.entry-points.pytest11]
mcp_vcr = "pytest_mcp_vcr.plugin"
