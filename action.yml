name: 'MCP-VCR Verify Action'
description: 'Verify MCP server snapshots in CI/CD pipeline'
branding:
  icon: 'check-circle'
  color: 'green'
inputs:
  snapshots-dir:
    description: 'Path to directory containing golden snapshots'
    required: true
    default: 'snapshots'
  server-command:
    description: 'Command to run the server subprocess'
    required: true
  config:
    description: 'Path to .mcp-vcr.yaml configuration file'
    required: false
  timing-faithful:
    description: 'Enable timing-faithful replay'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.1.0
      with:
        python-version: '3.12'

    - name: Set up uv
      uses: astral-sh/setup-uv@1edb52594c857e2b5b13128931090f0640537287 # v5.3.0

    - name: Install mcp-vcr
      shell: bash
      run: |
        set -euo pipefail
        uv tool install "git+https://github.com/Nachiket-Roy/mcp-vcr.git@transport-abstraction"

    - name: Verify Snapshots
      shell: bash
      env:
        SNAPSHOTS_DIR: ${{ inputs.snapshots-dir }}
        SERVER_COMMAND: ${{ inputs.server-command }}
        CONFIG_PATH: ${{ inputs.config }}
        TIMING_FAITHFUL: ${{ inputs.timing-faithful }}
      run: |
        set -euo pipefail
        ARGS=()
        if [ -n "$CONFIG_PATH" ]; then
          ARGS+=("--config" "$CONFIG_PATH")
        fi
        if [ "$TIMING_FAITHFUL" = "true" ]; then
          ARGS+=("--timing-faithful")
        fi
        
        # Safely parse the server command string into a bash array handling shell quotes/escapes
        mapfile -t CMD_ARRAY < <(python3 -c "import shlex, sys; print('\n'.join(shlex.split(sys.argv[1])))" "$SERVER_COMMAND")
        
        echo "Verifying snapshots under $SNAPSHOTS_DIR..."
        mcp-vcr verify "${ARGS[@]}" "$SNAPSHOTS_DIR" -- "${CMD_ARRAY[@]}"
