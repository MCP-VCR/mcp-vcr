name: MCP Regression

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  regression:
    name: Run MCP Regression Snapshot Verification
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code to access golden snapshots
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Step 3: Install dependencies, including mcp-vcr
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mcp-vcr

      # Step 4: Run mcp-vcr verify to replay recorded sessions against the server
      # and diff the replayed, normalized responses against the golden snapshots.
      #
      # This command will exit 1 and print detailed structural/semantic regressions if any
      # contract or value changes are detected.
      #
      # Note: To intentionally update snapshots after modifying your server, run:
      #   mcp-vcr verify --update snapshots/ -- python server.py
      # locally, then commit the changed *_golden.yaml files to git.
      - name: Verify Golden Snapshots
        run: mcp-vcr verify snapshots/ -- python server.py
